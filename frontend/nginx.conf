server {
  listen 80;
  server_name _;

  # Health endpoint
  location = /health {
    add_header Content-Type text/plain;
    return 200 'OK';
  }

  root /usr/share/nginx/html;
  index index.html;

  # Serve static assets directly
  location /static/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # SPA fallback
  location / {
    try_files $uri /index.html;
  }
}
